spring:
  application:
    name: auth-service
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/auth/realms/${KEYCLOAK_REALM:ecommerce}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql8}:${MYSQL_PORT:3306}/auth_service
    username: auth_service
    password: auth_service
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: ${SERVER_PORT:8081}


keycloak:
  auth-server-url: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/auth
  client-secret: ${KEYCLOAK_CLIENT_SECRET:vmx7F1YpWv5kxYYhVkVvnimRD1cD1dlj}
  realm: ecommerce
  client-id-register: admin-cli
  client-id-login: auth-service
  username: ${KC_BOOTSTRAP_ADMIN_USERNAME:admin}
  password: ${KC_BOOTSTRAP_ADMIN_PASSWORD:123456}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always