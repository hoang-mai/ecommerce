spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/ecommerce
  data:
    mongodb:
      uri: mongodb://notification-service:notification-service@localhost:27017/notification-service
minio:
  url: http://localhost:9000
  access-key: root
  secret-key: password
  bucket-name: ecommerce

server:
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

openapi:
  service:
    api-docs: Notification-Service-API-docs
    serverUrl: http://localhost:${server.port}
    serverName: server dev
    title: Notification Service API
    version: 1.0.0
    description: API document
logging:
  level:
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
    org.springframework.web.servlet.handler: DEBUG