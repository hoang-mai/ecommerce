services:
  mysql:
    image: mysql:8
    container_name: mysql8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - service-network

  temporal:
    image: temporalio/auto-setup
    container_name: temporal
    ports:
      - "7233:7233"
    environment:
      - DB=mysql8
      - MYSQL_USER=temporal
      - MYSQL_PWD=temporal
      - MYSQL_SEEDS=mysql
      - MYSQL_DB=temporal
      - TEMPORAL_WEB_ENABLED=true
    depends_on:
      - mysql
    networks:
      - service-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - service-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: keycloak
    ports:
      - "18080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=123456
      - DB_DATABASE=keycloak
      - DB_USER=keycloak
      - DB_PASSWORD=keycloak
    command:
      - start-dev
      - --http-relative-path=/auth
    networks:
      - service-network
    volumes:
      - keycloak_data:/opt/keycloak/data
  mongo:
    image: mongo:6.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - service-network
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - service-network
    command: server /data --console-address ":9001"
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,INTERNAL://kafka:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - service-network
    volumes:
      - kafka-data:/var/lib/kafka/data
  api-gateway:
    image: maianhhoang31072003/api-gateway:latest
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - service-network
  auth-service:
    image: maianhhoang31072003/auth-service:latest
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8081:8081"
      - "9092:9092"
    depends_on:
      - keycloak
      - mysql
      - kafka
    networks:
      - service-network
  user-service:
    image: maianhhoang31072003/user-service:latest
    container_name: user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8089:8089"
      - "9093:9093"
    depends_on:
      - mysql
      - kafka
      - minio
    networks:
      - service-network
  saga-service:
    image: maianhhoang31072003/saga-service:latest
    container_name: saga-service
    build:
      context: ./saga-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8088:8088"
    depends_on:
      - temporal
      - kafka
      - user-service
      - auth-service
    networks:
      - service-network
  review-service:
    image: maianhhoang31072003/review-service:latest
    container_name: review-service
    build:
      context: ./review-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8087:8087"
    depends_on:
      - mysql
      - minio
      - kafka
    networks:
      - service-network
  read-service:
    image: maianhhoang31072003/read-service:latest
    container_name: read-service
    build:
      context: ./read-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8086:8086"
    depends_on:
      - mongo
      - minio
      - kafka
    networks:
      - service-network
  product-service:
    image: maianhhoang31072003/product-service:latest
    container_name: product-service
    build:
      context: ./product-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8085:8085"
    depends_on:
      - mysql
      - minio
      - kafka
    networks:
      - service-network
  order-service:
    image: maianhhoang31072003/order-service:latest
    container_name: order-service
    build:
      context: ./order-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - minio
      - kafka
    networks:
      - service-network
  chat-notification-service:
    image: maianhhoang31072003/chat-notification-service:latest
    container_name: chat-notification-service
    build:
      context: ./chat-notification-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8082:8082"
    depends_on:
      - mongo
      - minio
      - kafka
    networks:
      - service-network
  payment-service:
    image: maianhhoang31072003/payment-service:latest
    container_name: payment-service
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - kafka
    networks:
      - service-network
volumes:
  mysql-data:
  mongo_data:
  keycloak_data:
  minio_data:
  kafka-data:
  redis-data:
networks:
  service-network:
    driver: bridge
