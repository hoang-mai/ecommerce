spring:
  application:
    name: chat-notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/auth/realms/${KEYCLOAK_REALM:ecommerce}
  data:
    mongodb:
      uri: mongodb://chat-notification-service:chat-notification-service@${MONGODB_HOST:mongo}:${MONGODB_PORT:27017}/chat-notification-service

server:
  port: ${SERVER_PORT:8082}
minio:
  url: http://${MINIO_HOST:minio}:${MINIO_PORT:9000}
  access-key: root
  secret-key: password
  bucket-name: ecommerce

