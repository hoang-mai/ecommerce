server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8080}/auth/realms/ecommerce
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:auth-service}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: chat-notification-service-api
          uri: http://${CHAT_NOTIFICATION_SERVICE_HOST:chat-notification-service}:${CHAT_NOTIFICATION_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/chat/**, /api/v1/message/**, /api/v1/push-subscription/**, /api/v1/notification/**
        - id: chat-notification-service-websocket
          uri: http://${CHAT_NOTIFICATION_SERVICE_HOST:chat-notification-service}:${CHAT_NOTIFICATION_SERVICE_PORT:8082}
          predicates:
            - Path=/ws/**
        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:order-service}:${ORDER_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/order/**,/api/v1/cart/**
        - id: payment-service
          uri: http://${PAYMENT_SERVICE_HOST:payment-service}:${PAYMENT_SERVICE_PORT:8084}
          predicates:
            - Path=/api/v1/payment/**
        - id: product-service
          uri: http://${PRODUCT_SERVICE_HOST:product-service}:${PRODUCT_SERVICE_PORT:8085}
          predicates:
            - Path=/api/v1/product/**,/api/v1/category/**,/api/v1/shop/**
        - id: read-service
          uri: http://${READ_SERVICE_HOST:read-service}:${READ_SERVICE_PORT:8086}
          predicates:
            - Path=/api/v1/user-view/**,/api/v1/product-view/**,/api/v1/order-view/**,/api/v1/cart-view/**,/api/v1/shop-view/**,/api/v1/review-view/**,/api/v1/interaction/**
        - id: review-service
          uri: http://${REVIEW_SERVICE_HOST:review-service}:${REVIEW_SERVICE_PORT:8087}
          predicates:
            - Path=/api/v1/review/**,/api/v1/review-reply/**
        - id: saga-service
          uri: http://${SAGA_SERVICE_HOST:saga-service}:${SAGA_SERVICE_PORT:8088}
          predicates:
            - Path=/api/v1/saga/**
        - id: user-service
          uri: http://${USER_SERVICE_HOST:user-service}:${USER_SERVICE_PORT:8089}
          predicates:
            - Path=/api/v1/user/**,/api/v1/address/**,/api/v1/user-verification/**