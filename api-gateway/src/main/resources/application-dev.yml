server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/ecommerce
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8099
          predicates:
            - Path=/api/v1/auth/**
        - id: chat-notification-service-api
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/chat/**, /api/v1/message/**, /api/v1/push-subscription/**, /api/v1/notification/**
        - id: chat-notification-service-websocket
          uri: http://localhost:8082
          predicates:
            - Path=/ws/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/order/**,/api/v1/cart/**
        - id : payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/payment/**
        - id: product-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/product/**,/api/v1/category/**,/api/v1/shop/**
        - id: read-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/user-view/**,/api/v1/product-view/**,/api/v1/order-view/**,/api/v1/cart-view/**,/api/v1/shop-view/**,/api/v1/review-view/**,/api/v1/interaction/**
        - id: review-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/review/**,/api/v1/review-reply/**
        - id: saga-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/saga/**
        - id: user-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/user/**,/api/v1/address/**,/api/v1/user-verification/**