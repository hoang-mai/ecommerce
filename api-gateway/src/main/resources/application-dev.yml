server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/ecommerce
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user/**,/api/v1/address/**,/api/v1/user-verification/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/product/**,/api/v1/category/**,/api/v1/shop/**
        - id: chat-notification-service-api
          uri: lb://chat-notification-service
          predicates:
            - Path=/api/v1/chat/**, /api/v1/message/**
        - id: chat-notification-service-websocket
          uri: lb://chat-notification-service
          predicates:
            - Path=/ws/**
        - id: saga-service
          uri: lb://saga-service
          predicates:
            - Path=/api/v1/saga/**
        - id: read-service
          uri: lb://read-service
          predicates:
            - Path=/api/v1/user-view/**,/api/v1/product-view/**,/api/v1/order-view/**,/api/v1/cart-view/**,/api/v1/shop-view/**,/api/v1/review-view/**,/api/v1/interaction/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/order/**,/api/v1/cart/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/v1/review/**,/api/v1/review-reply/**