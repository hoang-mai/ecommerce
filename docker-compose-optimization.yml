services:
  mysql:
    image: mysql:8
    container_name: mysql8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - service-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  temporal:
    image: temporalio/auto-setup
    container_name: temporal
    ports:
      - "7233:7233"
    environment:
      - DB=mysql8
      - MYSQL_USER=temporal
      - MYSQL_PWD=temporal
      - CAST_SERVICE_PORT=7233
      - MYSQL_SEEDS=mysql
      - MYSQL_DB=temporal
      - SQL_MAX_CONNS=5
      - SQL_MAX_IDLE_CONNS=5
      - SQL_VISIBILITY_MAX_CONNS=5
      - SQL_VISIBILITY_MAX_IDLE_CONNS=5
    networks:
      - service-network
    mem_limit: 650m
    cpus: 1.0
    pids_limit: 400
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: keycloak
    ports:
      - "18080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=123456
      - JAVA_OPTS_APPEND=-Xms256m -Xmx384m
      - DB_DATABASE=keycloak
      - DB_USER=keycloak
      - DB_PASSWORD=keycloak
    command:
      - start-dev
      - --http-relative-path=/auth
    networks:
      - service-network
    mem_limit: 600m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    volumes:
      - keycloak_data:/opt/keycloak/data
  mongo:
    image: mongo:6.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d
    command: >
      mongod
      --auth
      --bind_ip_all
      --wiredTigerCacheSizeGB 0.25
    networks:
      - service-network
    mem_limit: 450m
    cpus: 0.6
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: >
      redis-server --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - service-network
    mem_limit: 200m
    cpus: 0.3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - service-network
    mem_limit: 150m
    cpus: 0.2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    command: server /data --console-address ":9001"
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,INTERNAL://kafka:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_SEGMENT_BYTES: 134217728
    networks:
      - service-network
    mem_limit: 700m
    cpus: 0.7
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-secrets:/var/lib/kafka/secrets
      - kafka-config:/mnt/shared/config
      - kafka-etc-secrets:/etc/kafka/secrets
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: elasticsearch
    environment:
      - USERNAME=elastic
      - PASSWORD=changeme
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=128m"
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=true
    mem_limit: 800m
    cpus: 0.6
    ulimits:
      memlock:
        soft: -1
        hard: -1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    command: >
      bash -c "
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-icu ]; then
          bin/elasticsearch-plugin install --batch analysis-icu
        fi
        /usr/local/bin/docker-entrypoint.sh
      "
    networks:
      - service-network
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - alertmanager
    networks:
      - service-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "19093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - service-network
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "13000:3000"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - service-network
  api-gateway:
    image: maianhhoang31072003/api-gateway:latest
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx350m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
    mem_limit: 450m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    ports:
      - "8080:8080"
    networks:
      - service-network
    depends_on:
      - auth-service
      - user-service
      - saga-service
      - review-service
      - read-service
      - product-service
      - order-service
      - chat-notification-service
      - payment-service
  auth-service:
    image: maianhhoang31072003/auth-service:latest
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms64m -Xmx256m
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=64m
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
        -Dfile.encoding=UTF-8
    mem_limit: 320m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    ports:
      - "8081:8081"
      - "9092:9092"
    depends_on:
      - keycloak
      - mysql
      - kafka
    networks:
      - service-network
  user-service:
