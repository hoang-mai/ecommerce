  mongo_data:
  mongo_config:
  keycloak_data:
  minio_data:
  kafka-data:
  kafka-secrets:
  kafka-config:
  kafka-etc-secrets:
  redis-data:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  ai_vector_data:
  models:
  es-data:
  es-plugins:
networks:
  service-network:
    driver: bridge
