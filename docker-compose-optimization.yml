  ai-service:
    build:
      context: ai-service
      dockerfile: Dockerfile
    image: maianhhoang31072003/ai-service:latest
    container_name: ai-service
    ports:
      - "8000:8000"
    volumes:
      - ai_vector_data:/app/vector_data
      - models:/models
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      VECTOR_STORAGE_DIR: /app/vector_data
      CLIP_MODEL_DIR: /models
    env_file:
      - ai-service/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - service-network
volumes:
