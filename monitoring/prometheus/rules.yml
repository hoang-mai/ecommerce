groups:
  - name: spring-boot-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (application, instance) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum by (application, instance) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected on {{ $labels.application }} (instance {{ $labels.instance }})"
          description: "Service {{ $labels.application }} instance {{ $labels.instance }} has error rate > 5% in last 5 minutes (current: {{ $value | humanizePercentage }})"

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, application, instance) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.application }} (instance {{ $labels.instance }})"
          description: "Service {{ $labels.application }} instance {{ $labels.instance }} has P95 latency > 1s (current: {{ $value }}s)"

      - alert: ServiceDown
        expr: up{job="spring-boot-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.application }} instance {{ $labels.instance }} is down"
          description: "Service {{ $labels.application }} instance {{ $labels.instance }} has been down for more than 1 minute"

      - alert: HighCPUUsage
        expr: sum by (application, instance) (process_cpu_usage) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.application }} (instance {{ $labels.instance }})"
          description: "Service {{ $labels.application }} instance {{ $labels.instance }} CPU usage > 90% for more than 5 minutes (current: {{ $value | humanizePercentage }})"

      - alert: HighMemoryUsage
        expr: |
          sum by (application, instance) (jvm_memory_used_bytes{area="heap"})
          /
          sum by (application, instance) (jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.application }} (instance {{ $labels.instance }})"
          description: "Service {{ $labels.application }} instance {{ $labels.instance }} heap memory usage > 85% for more than 5 minutes (current: {{ $value | humanizePercentage }})"

      - alert: TooManyGCPauses
        expr: sum by (application, instance) (rate(jvm_gc_pause_seconds_count[5m])) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Too many GC pauses on {{ $labels.application }} (instance {{ $labels.instance }})"
          description: "Service {{ $labels.application }} instance {{ $labels.instance }} has > 5 GC pauses per 5m (current: {{ $value }})"

      - alert: HighThreadCount
        expr: sum by (application, instance) (jvm_threads_live_threads) > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High thread count on {{ $labels.application }} (instance {{ $labels.instance }})"
          description: "Service {{ $labels.application }} instance {{ $labels.instance }} has > 200 active threads (current: {{ $value }})"

  - name: ai-service-alerts
    rules:
      - alert: AIServiceHighErrorRate
        expr: |
          sum by (application, instance) (rate(http_requests_total{application="ai-service",status=~"5.."}[5m]))
          /
          sum by (application, instance) (rate(http_requests_total{application="ai-service"}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected on AI Service (instance {{ $labels.instance }})"
          description: "AI Service instance {{ $labels.instance }} has error rate > 5% in last 5 minutes (current: {{ $value | humanizePercentage }})"

      - alert: AIServiceHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, application, instance) (rate(http_request_duration_seconds_bucket{application="ai-service"}[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on AI Service (instance {{ $labels.instance }})"
          description: "AI Service instance {{ $labels.instance }} has P95 latency > 2s (current: {{ $value }}s)"

      - alert: AIServiceDown
        expr: up{application="ai-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI Service instance {{ $labels.instance }} is down"
          description: "AI Service instance {{ $labels.instance }} has been down for more than 1 minute"

      - alert: AIServiceHighCPUUsage
        expr: rate(process_cpu_seconds_total{application="ai-service"}[5m]) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on AI Service (instance {{ $labels.instance }})"
          description: "AI Service instance {{ $labels.instance }} CPU usage > 90% for more than 5 minutes (current: {{ $value }}%)"

      - alert: AIServiceHighMemoryUsage
        expr: process_resident_memory_bytes{application="ai-service"} > 2147483648
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on AI Service (instance {{ $labels.instance }})"
          description: "AI Service instance {{ $labels.instance }} memory usage > 2GB for more than 5 minutes (current: {{ $value | humanize1024 }})"

      - alert: AIServiceHighOpenFileDescriptors
        expr: process_open_fds{application="ai-service"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High open file descriptors on AI Service (instance {{ $labels.instance }})"
          description: "AI Service instance {{ $labels.instance }} has > 1000 open file descriptors (current: {{ $value }})"

      - alert: AIServiceImageSearchSlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, handler) (rate(http_request_duration_seconds_bucket{application="ai-service",handler="/search-images"}[5m]))
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Image search endpoint is slow on AI Service"
          description: "AI Service /search-images endpoint has P95 latency > 5s (current: {{ $value }}s)"

      - alert: AIServiceHighRequestRate
        expr: sum by (application, instance) (rate(http_requests_total{application="ai-service"}[5m])) > 100
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High request rate on AI Service (instance {{ $labels.instance }})"
          description: "AI Service instance {{ $labels.instance }} is receiving > 100 requests/second (current: {{ $value }} req/s)"

